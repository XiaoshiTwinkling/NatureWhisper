# NatureWhisper shaderpack for Iris
# Milestone 1: overworld sky/celestial/star visuals driven by the mod's deterministic model,
# plus a reserved seam for wind/humidity (future clouds & water).

# Vanilla cloud geometry off: the pack owns cloud visuals (M2), vanilla layer would double.
clouds=off

# Program files live per-dimension: world0 = overworld, world1 = end, world-1 = nether.
# Iris selects world0/<name>.vsh/.fsh for the overworld automatically.

# Reserved per-frame channel for the mod's climate (goals 3 & 4). Iris exposes no public API to
# push per-frame floats into a running pack, so for now these are frozen constants declared here.
# M2 will make them live either via a version-guarded mixin into Iris's custom-uniform supplier,
# or analytically in GLSL (rainStrength + a deterministic per-column biome-humidity proxy).
uniform.float.nw_windX = 0.0
uniform.float.nw_windZ = 0.0
uniform.float.nw_windStrength = 0.0
uniform.float.nw_humidity = 0.0
